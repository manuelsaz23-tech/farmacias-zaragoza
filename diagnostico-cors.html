<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico API Zaragoza · GitHub Pages</title><main style="font:16px system-ui;max-width:750px;margin:auto;padding:20px"><h1>Diagnóstico: API de farmacias de Zaragoza</h1><p>Esta prueba debe ejecutarse desde la URL HTTPS publicada en GitHub Pages. <strong>No se envían datos personales.</strong></p><button id="go" style="padding:12px">Probar acceso directo y CORS</button><pre id="out" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#eff5f2;padding:18px;border-radius:10px">Pendiente de prueba</pre><p><a href="./">Volver a la aplicación</a></p></main><script>
document.getElementById('go').onclick=async()=>{const out=document.getElementById('out');const u='https://www.zaragoza.es/sede/servicio/farmacia.json?tipo=guardia&rows=1&srsname=wgs84';out.textContent='Consultando '+u+' ...';const t=performance.now();try{const r=await fetch(u,{mode:'cors',cache:'no-store',headers:{Accept:'application/json'}});const ct=r.headers.get('content-type');const body=await r.text();let j=null;try{j=JSON.parse(body)}catch{}out.textContent=['Origen: '+location.origin,'HTTP: '+r.status,'Tiempo: '+Math.round(performance.now()-t)+' ms','Tipo: '+ct,'JSON válido: '+!!j,'CORS de lectura: '+(r.ok?'PERMITIDO para esta consulta':'Recibida respuesta HTTP, pero no exitosa'),'Vista previa (máximo 350 caracteres): '+body.slice(0,350)].join('\n')}catch(e){out.textContent='No se pudo leer la respuesta desde este navegador. Puede ser CORS, conexión, DNS o indisponibilidad del servicio.\nError: '+e.message+'\nConsulta la consola de Edge (F12 > Console/Network) para determinar la causa. No se debe interpretar este resultado por sí solo como prueba de bloqueo CORS.'}};
</script></html>
